project:
  experiment_name: cei_220_smoke
  output_root: results
  data_root: data
  artifact_schema_version: cei-artifact-v1
  seed_derivation_version: cei-seed-v1
  namespace_version: cei-namespace-v1
  hkdf_salt: cei-v1

runtime:
  device: auto
  batch_size: 256
  epochs: 1
  learning_rate: 0.001
  num_workers: 0
  pin_memory: false
  optimizer: adam
  weight_decay: 0.0
  external_seed: 20236573
  seed_generalization_seeds: [20236573]
  main_runs: 1
  seed_runs_per_seed: 1
  perturbation_runs: 1
  cublas_workspace_config: ":4096:8"

protocol:
  main_modes: [baseline, cei_lite, cei_strict, perturbed]
  seed_generalization_mode: cei_strict
  strong_perturbation_modes: [perturbed_loader_seed, perturbed_model_seed]

matrix:
  - dataset: cifar10
    model: smallcnn

expected_environment: {}
