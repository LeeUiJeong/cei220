name: Offline distribution checks

# Manual only: runs after publication only if the owner starts it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.5 pandas==2.3.3 PyYAML==6.0.2 pytest==9.0.2
          python -m pip install . --no-deps
      - name: Check preserved source files
        run: python tools/check_distribution.py
      - name: Run offline tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Inspect planned jobs without training
        run: python scripts/run_all.py --config configs/experiment_220.yaml --dry-run
