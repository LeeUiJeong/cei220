[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cei220"
version = "1.0.0"
description = "Reference implementation for Controlled Entropy Injection (CEI) reproducibility experiments"
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [
  {name = "Uijeong Lee"}
]
dependencies = [
  "numpy==2.2.5",
  "pandas==2.3.3",
  "PyYAML>=6.0,<7",
  "torch==2.11.0",
  "torchvision==0.26.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "jupyterlab>=4,<5"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
